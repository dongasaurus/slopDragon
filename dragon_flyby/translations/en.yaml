configuration:
  enabled:
    name: Enabled
    description: Turn off and restart the add-on to remove the visitors from your dashboards.
  interval_minutes:
    name: Minutes between visits
    description: How often a visitor crosses the screen (1-1440).
  duration_seconds:
    name: Seconds on screen
    description: How long each visit lasts, 1 to 10 seconds. Default 5.
  theme:
    name: Theme
    description: "Who visits: dragons, christmas, australianchristmas, halloween, easter, minecraft, weather, newyear, lunarnewyear, valentines, stpatricks, diadelosmuertos, diwali, eid, birthdays, or auto to follow the calendar. The Documentation tab lists who appears in each. To pick one specific dragon, turn on 'Show unused optional configuration options' below."
  unicorn_chance:
    name: Unicorn chance (%)
    description: Chance that a unicorn flies by instead of the usual visitor, in every theme. 0 turns it off, 25 is the most. Default 5.
  dragon:
    name: Dragon (dragons and auto themes only)
    description: "Pick one dragon instead of a random one: shadow (Shadow Wing), spike (Spike Tail), ember (Ember Horn) or moon (Moon Glider). Only used by the dragons theme, and by auto outside the holidays."
  size:
    name: Size
    description: How big the visitors are drawn (small, medium, large or extralarge).
  dashboards_only:
    name: Dashboards only
    description: Only show visitors on dashboards, not on Settings or other pages.
  fly_on_load:
    name: Visit on page load
    description: Also send a visitor a few seconds after a dashboard is opened.
  weather_entity:
    name: Weather entity
    description: "Used by the weather theme. Your weather entity, for example weather.forecast_home, or weather.melbourne from the Bureau of Meteorology integration. Leave as auto to use the first weather entity found."
  auto_holidays:
    name: Holidays in auto
    description: Which holidays the auto theme celebrates. Remove any you don't want.
  birthdays:
    name: Birthdays
    description: "People to celebrate: a name, day and month, plus an optional birth year to show their age. On the day, birthday visitors join whatever theme is set."
