name: Dragon Flyby
version: "1.7.0"
slug: dragon_flyby
description: A dragon, or a holiday or weather visitor, crosses your dashboard every few minutes.
url: https://github.com/dongasaurus/slopDragon
arch:
  - aarch64
  - amd64
init: false
startup: once
boot: auto
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  enabled: true
  interval_minutes: 15
  duration_seconds: 5
  theme: dragons
  unicorn_chance: 5
  size: medium
  dashboards_only: true
  fly_on_load: false
  weather_entity: auto
  auto_holidays:
    - birthdays
    - newyear
    - valentines
    - stpatricks
    - lunarnewyear
    - diwali
    - eid
    - diadelosmuertos
    - easter
    - halloween
    - christmas
  birthdays: []
schema:
  enabled: bool
  interval_minutes: int(1,1440)
  duration_seconds: float(1,10)
  theme: list(dragons|christmas|australianchristmas|halloween|easter|minecraft|weather|newyear|lunarnewyear|valentines|stpatricks|diadelosmuertos|diwali|eid|birthdays|auto)
  unicorn_chance: int(0,25)
  dragon: list(random|shadow|spike|ember|moon)?
  size: list(small|medium|large|extralarge)
  dashboards_only: bool
  fly_on_load: bool
  weather_entity: str
  auto_holidays:
    - "list(birthdays|newyear|valentines|stpatricks|lunarnewyear|diwali|eid|diadelosmuertos|easter|halloween|christmas)"
  birthdays:
    - name: str
      day: int(1,31)
      month: int(1,12)
      year: int(1900,2100)?
